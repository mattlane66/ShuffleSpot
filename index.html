<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://accounts.spotify.com https://api.spotify.com; img-src https://*.scdn.co; media-src https://*.scdn.co; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>ShuffleSpot</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <section id="login-screen">
      <h1>ShuffleSpot</h1>
      <p>ShuffleSpot groups the artists you follow on Spotify by genre.</p>
      <p>Choose a genre to shuffle artists and hear available track previews.</p>
      <button id="spotify-login" type="button">Login With Spotify</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="genre-container" aria-label="Your artist genres"></section>
  </main>
  <section id="player-container" aria-label="Music player"></section>
</body>
</html>
